[project]
name = "BYCEPS"
version = "0.0.5.dev1"
description = "LAN party web platform"
readme = "README.md"
authors = [
    { name = "Jochen Kupperschmidt", email = "homework@nwsnet.de" },
]
license = { text = "Revised BSD License" }
keywords = ["lanparty"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Natural Language :: German",
    "Programming Language :: JavaScript",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Message Boards",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
requires-python = ">=3.13"

[project.scripts]
byceps = "byceps:main"

[project.urls]
Homepage = "https://byceps.nwsnet.de/"
Documentation = "https://byceps.readthedocs.io/"
"Repository at GitHub" = "https://github.com/byceps/byceps"
"Repository at Sourcehut" = "https://git.sr.ht/~homeworkprod/byceps"
"Repository at Codeberg" = "https://codeberg.org/byceps/byceps"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
